<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <script src="/src/main.js" defer></script>
    <link rel="stylesheet" href="/src/style.css" />
    <title>Time tracking dashboard</title>
  </head>
  <body class="bg-navy-950 font-main min-h-screen">
    <div class="grid px-6 gap-6">
      <header>
        <div class="bg-navy-900 rounded-[15px]">
          <div
            class="bg-purple-600 flex p-8 rounded-[15px] items-center justify-between"
          >
            <picture class="size-16">
              <img
                class="border-white border-3 rounded-full"
                src="/images/image-jeremy.png"
                alt="Profile user picture"
              />
            </picture>

            <div class="flex flex-col gap-2">
              <p class="text-navy-200 text-[15px] leading-4.5">Report for</p>
              <h1 class="text-white text-[24px] leading-7 font-light">
                Jeremy Robson
              </h1>
            </div>
          </div>

          <ul
            class="flex text-purple-500 p-6 justify-between text-[18px] leading-5.25"
          >
            <li>Daily</li>
            <li>Weekly</li>
            <li>Monthly</li>
          </ul>
        </div>
      </header>

      <main class="grid">
        <section
          class="bg-orange-300 pt-9.5 rounded-[15px] overflow-hidden relative before:absolute before:-top-3.5 before:right-3.5 before:content-[''] before:bg-[url('/images/icon-work.svg')] before:bg-no-repeat before:size-19.5 before:bg-contain"
        >
          <div
            class="bg-navy-900 rounded-[15px] px-6 py-[27.5px] z-1 relative flex gap-2 flex-col"
          >
            <div class="flex justify-between items-center">
              <p class="text-white text-[18px] leading-5.25 font-medium">
                Work
              </p>
              <picture>
                <img src="/images/icon-ellipsis.svg" alt="Ellipsis icon" />
              </picture>
            </div>

            <div class="flex justify-between items-center">
              <p class="text-white text-[32px] leading-8 font-light">32hrs</p>
              <p class="text-navy-200 text-[15px] leading-4.5">
                Last Week - 36hrs
              </p>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
