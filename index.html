<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <script src="/src/main.js" defer></script>
    <link rel="stylesheet" href="/src/style.css" />
    <title>Time tracking dashboard</title>
  </head>
  <body class="bg-navy-950 font-main min-h-screen">
    <div class="grid px-6 gap-6">
      <header>
        <div class="bg-navy-900 rounded-[15px]">
          <div
            class="bg-purple-600 flex p-8 rounded-[15px] items-center justify-between"
          >
            <picture class="size-16">
              <img
                class="border-white border-3 rounded-full"
                src="/images/image-jeremy.png"
                alt="Profile user picture"
              />
            </picture>

            <div class="flex flex-col gap-2">
              <p class="text-navy-200 text-[15px] leading-4.5">Report for</p>
              <h1 class="text-white text-[24px] leading-7 font-light">
                Jeremy Robson
              </h1>
            </div>
          </div>

          <ul
            class="flex text-purple-500 p-6 justify-between text-[18px] leading-5.25"
          >
            <li>Daily</li>
            <li>Weekly</li>
            <li>Monthly</li>
          </ul>
        </div>
      </header>

      <main class="grid gap-6">
        <section
          class="bg-orange-300 before:bg-[url('/images/icon-work.svg')] activity-card"
        >
          <div class="bg-navy-900 activity-card-info">
            <div class="flex-container">
              <p class="activity-card-title">Work</p>
              <picture>
                <img src="/images/icon-ellipsis.svg" alt="Ellipsis icon" />
              </picture>
            </div>

            <div class="flex-container">
              <p class="activity-card-time">32hrs</p>
              <p class="activity-card-previous-week">Last Week - 36hrs</p>
            </div>
          </div>
        </section>

        <section
          class="bg-blue-300 before:bg-[url('/images/icon-play.svg')] activity-card"
        >
          <div class="bg-navy-900 activity-card-info">
            <div class="flex-container">
              <p class="activity-card-title">Play</p>
              <picture>
                <img src="/images/icon-ellipsis.svg" alt="Ellipsis icon" />
              </picture>
            </div>

            <div class="flex-container">
              <p class="activity-card-time">10hrs</p>
              <p class="activity-card-previous-week">Last Week - 36hrs</p>
            </div>
          </div>
        </section>

        <section
          class="bg-pink-400 before:bg-[url('/images/icon-study.svg')] activity-card"
        >
          <div class="bg-navy-900 activity-card-info">
            <div class="flex-container">
              <p class="activity-card-title">Study</p>
              <picture>
                <img src="/images/icon-ellipsis.svg" alt="Ellipsis icon" />
              </picture>
            </div>

            <div class="flex-container">
              <p class="activity-card-time">4hrs</p>
              <p class="activity-card-previous-week">Last Week - 7hrs</p>
            </div>
          </div>
        </section>

        <section
          class="bg-green-400 before:bg-[url('/images/icon-exercise.svg')] activity-card"
        >
          <div class="bg-navy-900 activity-card-info">
            <div class="flex-container">
              <p class="activity-card-title">Exercise</p>
              <picture>
                <img src="/images/icon-ellipsis.svg" alt="Ellipsis icon" />
              </picture>
            </div>

            <div class="flex-container">
              <p class="activity-card-time">4hrs</p>
              <p class="activity-card-previous-week">Last Week - 5hrs</p>
            </div>
          </div>
        </section>

        <section
          class="bg-purple-700 before:bg-[url('/images/icon-social.svg')] activity-card"
        >
          <div class="bg-navy-900 activity-card-info">
            <div class="flex-container">
              <p class="activity-card-title">Social</p>
              <picture>
                <img src="/images/icon-ellipsis.svg" alt="Ellipsis icon" />
              </picture>
            </div>

            <div class="flex-container">
              <p class="activity-card-time">5hrs</p>
              <p class="activity-card-previous-week">Last Week - 10hrs</p>
            </div>
          </div>
        </section>

        <section
          class="bg-yellow-300 before:bg-[url('/images/icon-self-care.svg')] activity-card"
        >
          <div class="bg-navy-900 activity-card-info">
            <div class="flex-container">
              <p class="activity-card-title">Self Care</p>
              <picture>
                <img src="/images/icon-ellipsis.svg" alt="Ellipsis icon" />
              </picture>
            </div>

            <div class="flex-container">
              <p class="activity-card-time">2hrs</p>
              <p class="activity-card-previous-week">Last Week - 2hrs</p>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
